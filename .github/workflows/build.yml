# Cross-platform build validation (#468 tee-up).
#
# Builds the desktop app on Windows, macOS AND Linux, so a change made on a Mac
# can't silently break the other platforms. Builds are UNSIGNED — this is
# validation, not release: no code-signing certs/secrets are used. When a Windows
# Authenticode cert exists, add a signed release workflow separately.
#
# Cost note: macOS runners bill 10x minutes and Windows 2x. Free on this repo
# while it is public, but the triggers below are shaped so that stops mattering
# if it ever goes private.

name: build

on:
  # `main` ONLY, not every branch. With `branches: ["**"]` a push to a PR branch
  # matched here AND under `pull_request`, so every commit built the full matrix
  # TWICE — six jobs where three would do. Branch work is validated by the
  # pull_request trigger; this push trigger is the post-merge safety net on main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One live run per branch/PR. Without this, pushing a follow-up commit leaves the
# previous matrix building a commit nobody is waiting on any more — burning a
# macOS runner at 10x to report on superseded code.
#
# `main` is deliberately excluded from cancellation (the `|| github.run_id` makes
# each main run its own group): those runs are the record of whether a merged
# commit builds, and cancelling one because the next merge landed would leave a
# gap exactly where the history should be complete.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Run the unit suite alongside the platform builds. The build jobs only compile
  # the installer — they never ran `node --test`, so a change that broke a unit
  # test (e.g. a skill's allowed-tools drifting out of sync) could merge green.
  # This job closes that gap.
  #
  # Runs on BOTH macOS and Linux. It was macOS-only, with a note that "some
  # tests shell out to macOS built-ins and aren't portable to a Linux runner
  # yet" and a follow-up to guard "the ~handful of macOS-specific tests".
  #
  # Running the suite on a real Ubuntu 24.04 box settled that: the handful was
  # ONE test, which hardcoded /bin/zsh (macOS's shell, absent on a bare Ubuntu).
  # Everything else already passed. With that fixed there is nothing left to
  # guard, so Linux joins the matrix rather than waiting for a nightly.
  #
  # This matters beyond tidiness: the Linux agent-terminal path (#329) has no
  # coverage at all on a macOS-only runner, and Linux is where the cloud-TA box
  # (#324) runs. A regression there would have merged green.
  unit-tests:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing must not hide the other's result
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Explicit, not incidental. Without an ffmpeg on PATH the call-media-merge
      # suite SKIPS rather than fails — 16 tests, the most-changed module in the
      # app — so a runner that happened to drop it would go quietly green while
      # covering less. Installed rather than assumed for exactly that reason.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # The tests import electron-app modules, some of which pull deps.
      - name: Install deps (electron-app)
        working-directory: electron-app
        run: npm ci
      - name: Run unit tests
        run: node --test tests/*.test.mjs

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--win"
          - os: macos-latest
            args: "--mac -c.mac.notarize=false"
          - os: ubuntu-latest
            args: "--linux"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-app
    env:
      # Don't attempt code-signing in CI — no certs here (validation build only).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install deps (electron-app)
        run: npm ci

      - name: Build unsigned installer
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vibeconf-${{ matrix.os }}
          path: |
            electron-app/dist/*.exe
            electron-app/dist/*.dmg
            electron-app/dist/*.zip
            electron-app/dist/*.AppImage
            electron-app/dist/*.deb
          if-no-files-found: ignore
          retention-days: 14
