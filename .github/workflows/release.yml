# Tag-triggered release: builds the Windows and Linux installers and attaches
# them to a DRAFT GitHub release.
#
# Why a draft: the release notes here are hand-written, and the app self-updates
# from these assets — a half-uploaded release shouldn't be visible to running
# apps. The draft collects its assets, you write the notes, then publish.
#
# macOS is deliberately NOT built here. The Mac build is signed and notarized,
# which needs Apple Developer certs; those aren't in GitHub secrets (and putting
# them there is a real decision, not a detail). Build the Mac locally with
# `pnpm dist` and attach it to the same draft:
#
#     V=0.8.10
#     gh release upload "v$V" electron-app/dist/*"$V"*.dmg \
#                             electron-app/dist/*"$V"*-mac.zip \
#                             electron-app/dist/latest-mac.yml
#
# Glob on the VERSION, not just the extension. dist/ is not cleaned between
# builds, so a bare `dist/*.dmg` also matches every previous release still
# sitting there and quietly uploads a stale build onto the new release — hit
# for real cutting v0.8.0-beta1, with v0.7.0-beta66 still in dist/.
#
# All three matter: Squirrel.Mac updates from the .zip (not the .dmg), and
# latest-mac.yml is the feed that points at it. Upload the .dmg alone and macOS
# self-update silently does nothing.
#
# EXPECTED, not a bug: the .dmg itself reports unsigned and unstapled —
#
#     spctl -a -t install ...dmg   -> rejected (no usable signature)
#     xcrun stapler validate ...dmg -> does not have a ticket stapled to it
#
# What gets signed, notarized and stapled is the .app INSIDE. Verify that
# instead, and only that:
#
#     spctl -a -vvv electron-app/dist/mac-arm64/Vibeconferencing.app
#         -> accepted, source=Notarized Developer ID
#     xcrun stapler validate electron-app/dist/mac-arm64/Vibeconferencing.app
#         -> The validate action worked!
#
# electron-builder notarizes the .app and only then wraps it in the .dmg, so the
# container never gets a ticket of its own. Gatekeeper unwraps the .dmg and
# judges the .app, so users are unaffected. Every release since at least
# v0.8.0-beta1 has shipped this way. Checked and re-checked at v0.8.0-beta4 —
# if the .app verifies, the build is good; don't go hunting the .dmg.
#
# Windows is UNSIGNED — SmartScreen will warn ("More info" → "Run anyway").
# Linux AppImage/deb need no signing.
#
# The Windows installer name must contain NO SPACES, which is why nsis
# .artifactName is pinned to "${productName}-Setup-${version}.${ext}". Leave it
# unset and electron-builder's default gives you three different names for one
# file, and Windows self-update 404s:
#
#     on disk (electron-builder default)  Vibeconferencing Setup 1.2.3.exe
#     written into latest.yml (spaces→-)  Vibeconferencing-Setup-1.2.3.exe
#     stored by GitHub (spaces→.)         Vibeconferencing.Setup.1.2.3.exe
#
# electron-updater reads latest.yml, requests the hyphenated URL, and gets a
# 404 — silently, so the app just never offers an update. Windows self-update
# was broken this way from the first release through v0.8.0-beta4, found only
# by running the Windows build and noticing no modal ever appeared. macOS and
# Linux were never affected: their artifact names have no spaces to mangle.
#
# If you ever see the mismatch on a published release, renaming the asset fixes
# it without a re-upload (sha512 covers content, not filename):
#
#     id=$(gh api repos/wanderingstan/vibeconf-app/releases/tags/vX --jq \
#          '.assets[]|select(.name|endswith(".exe"))|.id')
#     gh api -X PATCH repos/wanderingstan/vibeconf-app/releases/assets/$id \
#          -f name='Vibeconferencing-Setup-X.exe'
#
# Usage (clean semver — NO -beta suffix, and no -rc either; see THE TWO-TRACK
# MODEL at the create-draft step):
#     npm version --no-git-tag-version 0.8.10   # in BOTH package.json files
#     git commit -am "Release v0.8.10" && git push
#     git tag v0.8.10 && git push origin v0.8.10
#
# That leaves a DRAFT with the Windows/Linux assets. Then, locally:
#     # build + attach the notarized Mac assets (see the block above)
#     gh release edit v0.8.10 --draft=false --prerelease \
#                             --title "v0.8.10 (candidate)" --notes-file notes.md
#
# --prerelease is what puts it on the candidate track. Promote it to everyone
# later with scripts/promote.sh, which flips the same release rather than
# rebuilding it.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fail before spending build minutes if the tag and package.json disagree —
  # main has drifted from the released version before (128 commits at v0.7.0-beta62).
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json electron-app/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$tag" ]; then
              echo "::error::$f is $v but the tag is $tag — bump the version and re-tag."
              exit 1
            fi
          done
          echo "version $tag matches both package.json files"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — reusing it"
            exit 0
          fi
          # Created as a DRAFT and NOT marked --prerelease here. Both of those are
          # decided later, by hand, when you publish — see "THE TWO-TRACK MODEL"
          # below. CI cannot know which track a build is for, so it does not guess.
          #
          # THE TWO-TRACK MODEL (canonical description lives in scripts/promote.sh):
          #   • You publish a candidate as a GitHub PRERELEASE, titled
          #     "vX.Y.Z (candidate)". Stan + Seth run the 'candidate' update channel
          #     (allowPrerelease on) and pick it up early.
          #   • scripts/promote.sh later flips that same release prerelease → latest,
          #     gated on a green nightly, and everyone else gets the exact bits
          #     already tested. No rebuild, no re-notarize.
          # So the prerelease FLAG is the track signal, and it is the ONLY one.
          #
          # ⚠️ The VERSION must stay clean semver (0.8.10, NOT 0.8.10-rc.1) even for
          # a candidate. A version carrying a prerelease COMPONENT is rejected by
          # 'release'-channel clients even after promotion, which would make the
          # promotion a no-op for the people it is for. The flag is reversible; the
          # version string is not.
          #
          # (History, and why this comment used to say the opposite: tags once
          # carried a -betaN suffix. That was a mistake — the no-dot form breaks
          # semver ordering past single digits, because `beta9`/`beta10` are single
          # alphanumeric identifiers compared LEXICALLY, so `beta10` sorts BELOW
          # `beta9`. GitHub/electron-updater then couldn't identify the true latest
          # and the updater lagged / stepped through intermediate versions. Dropping
          # the SUFFIX fixed that. This comment then went further and said never to
          # mark --prerelease at all, which was true only until the two-track model
          # arrived — every release since v0.8.31 has in fact shipped as a
          # prerelease. Keep the two straight: no prerelease component in the
          # VERSION, prerelease FLAG on candidates.)
          flags="--draft --generate-notes"
          gh release create "$GITHUB_REF_NAME" $flags --title "$GITHUB_REF_NAME"

  build:
    needs: prepare
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--win"
          - os: ubuntu-latest
            args: "--linux"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-app
    env:
      # No code-signing certs in CI — see the header note.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install deps (electron-app)
        run: npm ci

      - name: Build installer
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      - name: Attach installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # latest*.yml is what electron-updater actually reads — without it the
          # installers are just files and nothing self-updates. Each platform
          # emits its own (latest.yml on Windows, latest-linux.yml on Linux),
          # and macOS contributes latest-mac.yml from the local build.
          assets=(dist/*.exe dist/*.AppImage dist/*.deb dist/latest*.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no installers found in electron-app/dist"
            exit 1
          fi
          printf 'uploading: %s\n' "${assets[@]}"
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
