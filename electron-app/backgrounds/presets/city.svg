<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <!-- Stops are placed against the full 720 height but only the top ~505 is
           ever visible, so the warm dusk band is pulled up to land behind the
           skyline rather than below the waterline. -->
      <stop offset="0" stop-color="#1d3160"/>
      <stop offset="0.32" stop-color="#4a5c93"/>
      <stop offset="0.55" stop-color="#c07f8a"/>
      <stop offset="0.7" stop-color="#f5b784"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3d6b"/>
      <stop offset="1" stop-color="#101c3a"/>
    </linearGradient>
    <!-- Tower faces lit from the upper right like the rest of the set; one ramp
           in userSpaceOnUse so both towers share a single continuous light. -->
    <linearGradient id="steel" gradientUnits="userSpaceOnUse"
                    x1="1000" y1="240" x2="200" y2="520">
      <stop offset="0" stop-color="#4b3a4e"/>
      <stop offset="1" stop-color="#2a2236"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <circle cx="1030" cy="400" r="42" fill="#ffe0ad" opacity="0.85"/>

  <!-- Far skyline: hazed toward the sky colour, no window detail, so it sits
       back. Crests straddle the vertical centre for the cover-fit crop. -->
  <g fill="#6c6f9c" opacity="0.5">
    <rect x="30" y="360" width="54" height="150"/>
    <rect x="96" y="410" width="40" height="100"/>
    <rect x="150" y="330" width="60" height="180"/>
    <rect x="360" y="390" width="46" height="120"/>
    <rect x="418" y="345" width="52" height="165"/>
    <rect x="620" y="372" width="44" height="138"/>
    <rect x="676" y="410" width="56" height="100"/>
    <rect x="960" y="352" width="50" height="158"/>
    <rect x="1080" y="392" width="46" height="118"/>
    <rect x="1138" y="336" width="58" height="174"/>
  </g>

  <!-- Mid skyline: the city proper. Darker, with a spire and a stepped crown so
       the silhouette has landmarks instead of an even comb of rectangles. -->
  <g fill="#2e2a45">
    <rect x="0" y="430" width="70" height="90"/>
    <rect x="82" y="386" width="58" height="134"/>
    <rect x="196" y="352" width="66" height="168"/>
    <rect x="274" y="416" width="48" height="104"/>
    <rect x="470" y="398" width="62" height="122"/>
    <rect x="546" y="300" width="70" height="220"/>
    <rect x="566" y="270" width="30" height="34"/>
    <rect x="578" y="228" width="6" height="46"/>
    <rect x="630" y="424" width="54" height="96"/>
    <rect x="700" y="366" width="60" height="154"/>
    <rect x="790" y="410" width="50" height="110"/>
    <rect x="1010" y="378" width="64" height="142"/>
    <rect x="1088" y="332" width="56" height="188"/>
    <rect x="1160" y="404" width="60" height="116"/>
    <rect x="1232" y="368" width="48" height="152"/>
  </g>

  <!-- Lit windows. Sparse and irregular — a full grid reads as graph paper at
       the size an avatar background gets composited to. -->
  <g fill="#ffd98a" opacity="0.75">
    <rect x="208" y="368" width="8" height="12"/>
    <rect x="232" y="368" width="8" height="12"/>
    <rect x="208" y="398" width="8" height="12"/>
    <rect x="244" y="420" width="8" height="12"/>
    <rect x="220" y="446" width="8" height="12"/>
    <rect x="558" y="318" width="9" height="13"/>
    <rect x="584" y="318" width="9" height="13"/>
    <rect x="558" y="352" width="9" height="13"/>
    <rect x="596" y="352" width="9" height="13"/>
    <rect x="571" y="386" width="9" height="13"/>
    <rect x="596" y="420" width="9" height="13"/>
    <rect x="712" y="384" width="8" height="12"/>
    <rect x="738" y="384" width="8" height="12"/>
    <rect x="712" y="414" width="8" height="12"/>
    <rect x="738" y="444" width="8" height="12"/>
    <rect x="1098" y="350" width="8" height="12"/>
    <rect x="1124" y="350" width="8" height="12"/>
    <rect x="1098" y="382" width="8" height="12"/>
    <rect x="1124" y="414" width="8" height="12"/>
    <rect x="1022" y="396" width="8" height="12"/>
    <rect x="1050" y="426" width="8" height="12"/>
    <rect x="96" y="404" width="8" height="12"/>
    <rect x="120" y="434" width="8" height="12"/>
  </g>

  <!-- Harbour. Waterline sits below the skyline base so the towers stand in it. -->
  <rect y="505" width="1280" height="215" fill="url(#water)"/>

  <!-- Reflections as broken horizontal dashes rather than mirrored shapes —
       flat mirrored copies read as a fold, dashes read as moving water. -->
  <g stroke="#ffd98a" stroke-linecap="round" fill="none" opacity="0.3">
    <path d="M556 520 H600" stroke-width="4"/>
    <path d="M562 542 H594" stroke-width="3"/>
    <path d="M548 570 H606" stroke-width="4"/>
    <path d="M1096 524 H1132" stroke-width="4"/>
    <path d="M1090 552 H1140" stroke-width="3"/>
    <path d="M708 528 H748" stroke-width="3"/>
    <path d="M1012 516 H1058" stroke-width="3"/>
  </g>

  <!-- Suspension bridge, foreground. Deck spans the full width so it reads as
       crossing the frame rather than as an object floating in it. -->
  <g stroke="#2a2236" fill="none" stroke-linecap="round">
    <!-- Side-span cables, anchored off both edges. -->
    <path d="M-20 452 Q150 470 300 262" stroke-width="5"/>
    <path d="M1300 452 Q1130 470 880 262" stroke-width="5"/>
    <!-- Main span. Hanger tops are sampled off this same curve, so they meet
         the cable exactly instead of floating near it. -->
    <path d="M300 262 Q590 470 880 262" stroke-width="6"/>
    <g stroke-width="3">
      <path d="M416 326 V468"/>
      <path d="M503 355 V468"/>
      <path d="M590 364 V468"/>
      <path d="M677 355 V468"/>
      <path d="M764 326 V468"/>
    </g>
  </g>

  <!-- Towers, standing in the water on their piers. -->
  <g fill="url(#steel)">
    <rect x="286" y="250" width="16" height="330"/>
    <rect x="298" y="250" width="16" height="330"/>
    <rect x="286" y="300" width="28" height="10"/>
    <rect x="286" y="392" width="28" height="10"/>
    <rect x="272" y="560" width="56" height="24"/>
    <rect x="866" y="250" width="16" height="330"/>
    <rect x="878" y="250" width="16" height="330"/>
    <rect x="866" y="300" width="28" height="10"/>
    <rect x="866" y="392" width="28" height="10"/>
    <rect x="852" y="560" width="56" height="24"/>
  </g>

  <!-- Deck: roadway slab plus a lighter guard rail to keep the edge legible
       against the dark water. -->
  <rect y="468" width="1280" height="14" fill="#3a2f47"/>
  <rect y="464" width="1280" height="4" fill="#8a7f96"/>
  <g fill="#ffe4b0" opacity="0.5">
    <rect x="70" y="472" width="26" height="3"/>
    <rect x="180" y="472" width="26" height="3"/>
    <rect x="430" y="472" width="26" height="3"/>
    <rect x="620" y="472" width="26" height="3"/>
    <rect x="940" y="472" width="26" height="3"/>
    <rect x="1120" y="472" width="26" height="3"/>
  </g>
</svg>
