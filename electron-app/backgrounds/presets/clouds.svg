<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4079af"/>
      <stop offset="1" stop-color="#fff1d0"/>
    </linearGradient>
    <!-- Cloud shading: lit from the upper right, shadow falling to the lower
         left. userSpaceOnUse (not the default objectBoundingBox) is the point —
         it pins the ramp to the cloud template's own coordinates, so all four
         shapes share one continuous gradient instead of each circle restarting
         its own, and every <use> inherits it correctly through its transform. -->
    <linearGradient id="cloudLight" gradientUnits="userSpaceOnUse"
                    x1="240" y1="0" x2="0" y2="90">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde9f0"/>
    </linearGradient>
    <!-- One cloud, drawn once and reused at three sizes. The shapes overlap
         inside a single group so the group's opacity composites them as one
         silhouette — otherwise the overlaps would show as darker seams. -->
    <g id="cloud">
      <rect x="0" y="45" width="240" height="45" rx="22"/>
      <circle cx="60" cy="48" r="42"/>
      <circle cx="125" cy="32" r="55"/>
      <circle cx="185" cy="50" r="38"/>
    </g>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Clouds, kept in the upper half and off the horizon line. Varied size and
       height so they read as depth rather than a row. -->
  <g fill="url(#cloudLight)" opacity="0.9">
    <use href="#cloud" transform="translate(140 150) scale(1.05)"/>
    <use href="#cloud" transform="translate(980 110) scale(0.62)"/>
    <use href="#cloud" transform="translate(760 235) scale(0.8)"/>
  </g>

  <!-- Hills. Crests sit near the vertical centre so the cover-fit crop takes
       sky and foreground, never the horizon line. -->
  <path d="M0 430 Q320 300 640 420 T1280 395 V720 H0 Z" fill="#a8c46f"/>
  <path d="M0 530 Q384 460 768 530 T1280 520 V720 H0 Z" fill="#789048"/>
</svg>
