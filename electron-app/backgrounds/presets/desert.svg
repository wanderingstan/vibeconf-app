<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8834a"/>
      <stop offset="0.55" stop-color="#f5b06b"/>
      <stop offset="1" stop-color="#ffe1a8"/>
    </linearGradient>
    <!-- Dune faces: lit from the upper right like the cloud sheet, so the sunlit
         crest and the shadowed leeward side come from one shared ramp. -->
    <linearGradient id="duneLight" gradientUnits="userSpaceOnUse"
                    x1="1280" y1="380" x2="200" y2="720">
      <stop offset="0" stop-color="#f0c184"/>
      <stop offset="1" stop-color="#c98d55"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Placed in the gap between mesas so the disc stays a full circle. -->
  <circle cx="828" cy="248" r="58" fill="#fff0c8" opacity="0.9"/>

  <!-- Distant mesas, hazed back toward the sky colour. Sloped flanks and enough
       height to read as landform; square blocks at this scale read as buildings. -->
  <path d="M0 440 L70 330 L120 302 L300 302 L350 330 L392 440 Z"
        fill="#c9846a" opacity="0.5"/>
  <path d="M470 440 L520 362 L556 342 L676 342 L712 362 L756 440 Z"
        fill="#c9846a" opacity="0.42"/>
  <path d="M900 440 L958 318 L1000 292 L1148 292 L1190 318 L1244 440 Z"
        fill="#c9846a" opacity="0.5"/>

  <!-- Dunes. Crests sit around the vertical centre so the crop takes sky above
       and sand below. -->
  <path d="M0 470 Q300 415 620 465 T1280 445 V720 H0 Z" fill="#eec48c"/>
  <path d="M0 560 Q360 495 700 555 T1280 535 V720 H0 Z" fill="url(#duneLight)"/>
  <path d="M0 660 Q420 590 800 650 T1280 625 V720 H0 Z" fill="#b57c4a"/>
</svg>
