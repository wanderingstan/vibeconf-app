<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb8d8"/>
      <stop offset="1" stop-color="#e6f2ea"/>
    </linearGradient>
    <!-- One conifer, drawn once and reused at many sizes. Tiers overlap inside
         a single group so a group opacity would composite them as one
         silhouette rather than showing seams. -->
    <g id="pine">
      <rect x="-5" y="120" width="10" height="40"/>
      <path d="M0 0 L34 62 H-34 Z"/>
      <path d="M0 42 L42 108 H-42 Z"/>
      <path d="M0 86 L50 152 H-50 Z"/>
    </g>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Hazy ridge behind the treeline, keeping the crest near mid-height. -->
  <path d="M0 400 Q260 320 520 395 T1040 380 T1280 405 V720 H0 Z" fill="#9dbfb2"/>

  <!-- Far treeline: small, pale, tightly spaced so it reads as texture. Trunk
       bases land just above the meadow crest and are covered by it. -->
  <g fill="#5c8a6e">
    <use href="#pine" transform="translate(60 382) scale(0.5)"/>
    <use href="#pine" transform="translate(170 398) scale(0.42)"/>
    <use href="#pine" transform="translate(300 372) scale(0.55)"/>
    <use href="#pine" transform="translate(430 396) scale(0.44)"/>
    <use href="#pine" transform="translate(560 380) scale(0.5)"/>
    <use href="#pine" transform="translate(700 392) scale(0.46)"/>
    <use href="#pine" transform="translate(830 376) scale(0.54)"/>
    <use href="#pine" transform="translate(960 400) scale(0.42)"/>
    <use href="#pine" transform="translate(1090 384) scale(0.5)"/>
    <use href="#pine" transform="translate(1220 392) scale(0.46)"/>
  </g>

  <!-- Meadow. A curve rather than a rect: a straight edge here would cut the
       treeline off as one hard horizontal seam. -->
  <path d="M0 500 Q320 458 640 492 T1280 470 V720 H0 Z" fill="#4a7a5e"/>

  <!-- Near trees: larger and darker, standing on the meadow. -->
  <g fill="#274a3a">
    <use href="#pine" transform="translate(120 470) scale(0.95)"/>
    <use href="#pine" transform="translate(340 505) scale(0.8)"/>
    <use href="#pine" transform="translate(640 480) scale(0.9)"/>
    <use href="#pine" transform="translate(900 512) scale(0.75)"/>
    <use href="#pine" transform="translate(1160 478) scale(0.88)"/>
  </g>
  <path d="M0 640 Q300 606 620 636 T1280 618 V720 H0 Z" fill="#2f5744"/>
</svg>
