<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6fa8"/>
      <stop offset="1" stop-color="#dfe9f2"/>
    </linearGradient>
    <!-- Snow caps read as lit from the upper right, matching the cloud sheet's
         light direction. userSpaceOnUse pins one ramp across every peak. -->
    <linearGradient id="snow" gradientUnits="userSpaceOnUse"
                    x1="1280" y1="200" x2="0" y2="480">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6ee"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Far range: pale and low-contrast so it sits back in the haze. -->
  <path d="M0 430 L150 320 L280 400 L430 285 L560 400 L700 300 L840 405 L980 310
           L1130 400 L1280 330 V720 H0 Z" fill="#9db4cc"/>

  <!-- Mid range. Crests straddle the vertical centre so a cover-fit crop keeps
       sky above and slope below, never a flat horizon line. -->
  <path d="M0 500 L190 370 L330 470 L500 340 L650 470 L810 360 L960 480
           L1120 385 L1280 470 V720 H0 Z" fill="#5f7b96"/>
  <g fill="url(#snow)">
    <path d="M500 340 L555 386 L525 380 L495 400 L465 382 L445 388 Z"/>
    <path d="M810 360 L862 404 L834 398 L806 416 L778 400 L758 406 Z"/>
    <path d="M190 370 L238 412 L212 406 L186 424 L160 408 L142 414 Z"/>
  </g>

  <!-- Near ridge: darkest and simplest, anchoring the foreground. -->
  <path d="M0 600 L260 505 L470 590 L720 495 L960 585 L1280 520 V720 H0 Z"
        fill="#33485e"/>
</svg>
