<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset="0.6" stop-color="#27406e"/>
      <stop offset="1" stop-color="#6a5b8c"/>
    </linearGradient>
    <!-- Aurora bands fade at both ends so they never terminate on a hard edge. -->
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd6a0" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#6ee7b7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8f7fe0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Stars: kept in the upper band, away from the aurora and the horizon. -->
  <g fill="#ffffff">
    <circle cx="90" cy="70" r="2.2" opacity="0.9"/>
    <circle cx="215" cy="130" r="1.6" opacity="0.7"/>
    <circle cx="330" cy="55" r="2" opacity="0.85"/>
    <circle cx="470" cy="120" r="1.4" opacity="0.6"/>
    <circle cx="590" cy="60" r="2.4" opacity="0.95"/>
    <circle cx="700" cy="145" r="1.5" opacity="0.65"/>
    <circle cx="830" cy="80" r="2" opacity="0.85"/>
    <circle cx="945" cy="40" r="1.7" opacity="0.75"/>
    <circle cx="1065" cy="125" r="2.2" opacity="0.9"/>
    <circle cx="1190" cy="65" r="1.5" opacity="0.7"/>
    <circle cx="150" cy="215" r="1.4" opacity="0.5"/>
    <circle cx="760" cy="220" r="1.6" opacity="0.55"/>
    <circle cx="1010" cy="200" r="1.3" opacity="0.5"/>
  </g>

  <!-- Two offset aurora ribbons; the thinner one sits lower and dimmer so the
       pair reads as depth rather than a doubled stroke. -->
  <g fill="none" stroke="url(#aurora)" stroke-linecap="round">
    <path d="M-40 300 Q300 190 660 285 T1320 240" stroke-width="46"/>
    <path d="M-40 370 Q340 275 700 355 T1320 320" stroke-width="26" opacity="0.7"/>
  </g>

  <!-- Silhouetted ridges: near-black, no detail, so any avatar composited over
       them stays legible. -->
  <path d="M0 470 L180 375 L340 455 L520 360 L690 460 L880 375 L1060 465
           L1280 395 V720 H0 Z" fill="#16294a"/>
  <path d="M0 585 L250 495 L470 575 L730 485 L980 575 L1280 505 V720 H0 Z"
        fill="#0a1730"/>
</svg>
