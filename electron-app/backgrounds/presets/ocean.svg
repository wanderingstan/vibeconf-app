<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <!-- Stops are placed against the full 720 height but only the top 440 is
           ever visible, so the warm band is pulled up to land at the horizon. -->
      <stop offset="0" stop-color="#1e4f8f"/>
      <stop offset="0.38" stop-color="#7fb3dd"/>
      <stop offset="0.61" stop-color="#ffe6c0"/>
    </linearGradient>
    <!-- The water darkens toward the viewer, the reverse of the sky, so the two
         meet at their lightest values and the horizon reads as glare. -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb8"/>
      <stop offset="1" stop-color="#0e3f6b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Low sun sitting just above the waterline. -->
  <circle cx="880" cy="378" r="46" fill="#fff0cb" opacity="0.95"/>

  <!-- Horizon near the vertical centre: a cover-fit crop keeps sky and water. -->
  <rect y="440" width="1280" height="280" fill="url(#sea)"/>

  <!-- Sun glitter as discrete dashes rather than a lit column: a gradient-faded
       rectangle would show its vertical edges against the flat sea. Widths grow
       and opacity drops with distance from the horizon. -->
  <g stroke="#ffeec4" stroke-linecap="round" fill="none">
    <path d="M856 452 H904" stroke-width="5" opacity="0.8"/>
    <path d="M844 472 H916" stroke-width="6" opacity="0.7"/>
    <path d="M862 492 H898" stroke-width="5" opacity="0.6"/>
    <path d="M832 516 H928" stroke-width="7" opacity="0.5"/>
    <path d="M854 546 H906" stroke-width="6" opacity="0.42"/>
    <path d="M818 580 H942" stroke-width="8" opacity="0.34"/>
    <path d="M846 622 H914" stroke-width="7" opacity="0.24"/>
    <path d="M806 668 H954" stroke-width="9" opacity="0.16"/>
  </g>

  <!-- Swells. Long, flat arcs only — anything steeper reads as scribble at the
       small sizes an avatar background gets composited to. -->
  <g fill="none" stroke="#bcdcf0" stroke-linecap="round" opacity="0.5">
    <path d="M120 500 q60 -12 120 0" stroke-width="4"/>
    <path d="M460 486 q50 -10 100 0" stroke-width="3"/>
    <path d="M1010 512 q70 -14 140 0" stroke-width="4"/>
    <path d="M240 578 q80 -16 160 0" stroke-width="5"/>
    <path d="M640 620 q95 -18 190 0" stroke-width="6"/>
    <path d="M60 668 q105 -20 210 0" stroke-width="7"/>
    <path d="M950 660 q100 -20 200 0" stroke-width="7"/>
  </g>
</svg>
