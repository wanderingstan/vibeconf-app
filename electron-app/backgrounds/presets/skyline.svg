<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16264f"/>
      <stop offset="0.34" stop-color="#41508a"/>
      <stop offset="0.62" stop-color="#c07f8d"/>
      <stop offset="0.82" stop-color="#f6bd8b"/>
      <stop offset="1" stop-color="#ffd9a8"/>
    </linearGradient>

    <!-- Window grids. userSpaceOnUse (not the default objectBoundingBox) is the
         point: every tower samples one global 24x30 lattice, so windows line up
         across the whole layer instead of each rect restarting its own grid.
         Every tower x and width below is a multiple of 24 to stay on it. -->
    <pattern id="winMid" patternUnits="userSpaceOnUse" width="24" height="30">
      <rect x="7" y="9" width="10" height="13" fill="#ffd68a" opacity="0.22"/>
    </pattern>
    <pattern id="winNear" patternUnits="userSpaceOnUse" width="24" height="30">
      <rect x="7" y="9" width="10" height="13" fill="#ffd68a" opacity="0.13"/>
    </pattern>

    <!-- Masses carry no fill of their own, so each <use> below paints the same
         geometry twice: once as silhouette, once as lit windows. -->
    <g id="midMass">
      <rect x="48" y="336" width="120" height="384"/>
      <rect x="192" y="192" width="96" height="528"/>
      <rect x="312" y="264" width="144" height="456"/>
      <rect x="480" y="144" width="120" height="576"/>
      <rect x="504" y="96" width="72" height="72"/>
      <rect x="624" y="288" width="96" height="432"/>
      <rect x="744" y="216" width="144" height="504"/>
      <rect x="912" y="168" width="120" height="552"/>
      <rect x="1056" y="312" width="96" height="408"/>
      <rect x="1176" y="240" width="104" height="480"/>
    </g>
    <g id="nearMass">
      <rect x="0" y="432" width="144" height="288"/>
      <rect x="168" y="384" width="120" height="336"/>
      <rect x="336" y="456" width="168" height="264"/>
      <rect x="528" y="360" width="144" height="360"/>
      <rect x="696" y="432" width="120" height="288"/>
      <rect x="840" y="396" width="192" height="324"/>
      <rect x="1056" y="444" width="144" height="276"/>
      <rect x="1224" y="408" width="56" height="312"/>
    </g>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Far towers: hazed toward the sky, no window detail, so they read as
       distance. Every layer runs to the bottom edge — the frame is all city,
       with no horizon line for a cover-fit crop to land on. -->
  <g fill="#7c80ad" opacity="0.4">
    <rect x="0" y="300" width="96" height="420"/>
    <rect x="120" y="250" width="72" height="470"/>
    <rect x="240" y="330" width="96" height="390"/>
    <rect x="384" y="270" width="72" height="450"/>
    <rect x="504" y="230" width="96" height="490"/>
    <rect x="648" y="310" width="72" height="410"/>
    <rect x="768" y="260" width="96" height="460"/>
    <rect x="912" y="330" width="72" height="390"/>
    <rect x="1008" y="240" width="96" height="480"/>
    <rect x="1152" y="300" width="128" height="420"/>
  </g>

  <!-- Mid layer: the skyline proper. Crowns and a spire break up what would
       otherwise be an even comb of rectangles. -->
  <use href="#midMass" fill="#3d3459"/>
  <use href="#midMass" fill="url(#winMid)"/>
  <rect x="534" y="40" width="8" height="60" fill="#3d3459"/>
  <rect x="216" y="168" width="48" height="26" fill="#3d3459"/>
  <rect x="936" y="140" width="72" height="30" fill="#3d3459"/>

  <!-- A scattering of brighter windows, snapped to the same lattice so they
       read as lit floors within the grid rather than as loose confetti. -->
  <g fill="#ffe1a0" opacity="0.85">
    <rect x="199" y="219" width="10" height="13"/>
    <rect x="247" y="249" width="10" height="13"/>
    <rect x="223" y="309" width="10" height="13"/>
    <rect x="271" y="369" width="10" height="13"/>
    <rect x="343" y="309" width="10" height="13"/>
    <rect x="415" y="339" width="10" height="13"/>
    <rect x="391" y="429" width="10" height="13"/>
    <rect x="511" y="189" width="10" height="13"/>
    <rect x="559" y="189" width="10" height="13"/>
    <rect x="535" y="249" width="10" height="13"/>
    <rect x="583" y="309" width="10" height="13"/>
    <rect x="511" y="369" width="10" height="13"/>
    <rect x="631" y="339" width="10" height="13"/>
    <rect x="679" y="399" width="10" height="13"/>
    <rect x="751" y="249" width="10" height="13"/>
    <rect x="823" y="279" width="10" height="13"/>
    <rect x="775" y="339" width="10" height="13"/>
    <rect x="847" y="369" width="10" height="13"/>
    <rect x="919" y="219" width="10" height="13"/>
    <rect x="991" y="189" width="10" height="13"/>
    <rect x="943" y="279" width="10" height="13"/>
    <rect x="1015" y="339" width="10" height="13"/>
    <rect x="1063" y="339" width="10" height="13"/>
    <rect x="1111" y="399" width="10" height="13"/>
    <rect x="1183" y="279" width="10" height="13"/>
    <rect x="1255" y="309" width="10" height="13"/>
  </g>

  <!-- Near layer: darkest and largest, all of it running off the bottom edge so
       the viewer sits among the towers rather than across a river from them. -->
  <use href="#nearMass" fill="#231d36"/>
  <use href="#nearMass" fill="url(#winNear)"/>
  <g fill="#ffe1a0" opacity="0.6">
    <rect x="55" y="489" width="10" height="13"/>
    <rect x="103" y="549" width="10" height="13"/>
    <rect x="199" y="429" width="10" height="13"/>
    <rect x="247" y="519" width="10" height="13"/>
    <rect x="367" y="489" width="10" height="13"/>
    <rect x="463" y="579" width="10" height="13"/>
    <rect x="559" y="399" width="10" height="13"/>
    <rect x="631" y="459" width="10" height="13"/>
    <rect x="583" y="549" width="10" height="13"/>
    <rect x="727" y="489" width="10" height="13"/>
    <rect x="871" y="429" width="10" height="13"/>
    <rect x="967" y="519" width="10" height="13"/>
    <rect x="919" y="609" width="10" height="13"/>
    <rect x="1087" y="489" width="10" height="13"/>
    <rect x="1159" y="579" width="10" height="13"/>
  </g>

  <!-- Rooftop beacons on the three tallest masses. -->
  <g fill="#ff6b5e">
    <circle cx="538" cy="36" r="5"/>
    <circle cx="240" cy="162" r="4"/>
    <circle cx="972" cy="134" r="4"/>
  </g>
</svg>
