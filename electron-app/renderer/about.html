<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>About Vibeconferencing</title>
  <style>
    /* Same dark palette as the panel and App Settings. This is a window of the
       same app, not a system dialog. */
    body {
      margin: 0;
      padding: 28px 24px 22px;
      background: #202124;
      color: #e8eaed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
      /* The whole window is a drag handle. It is frameless, so without this
         there is nothing to grab. Interactive bits opt back out below. */
      -webkit-app-region: drag;
    }
    /* The app icon, shown at its native aspect. Deliberately the same file the
       packaged app uses for its bundle icon (build.mac.icon), so this can never
       drift from what the Dock shows. No border-radius: the artwork is a
       transparent logo rather than a filled tile, so rounding would clip
       nothing and only risk shaving a corner off a shape. */
    .logo {
      width: 96px; height: 96px;
      margin: 0 auto 14px;
      display: block;
    }
    h1 { font-size: 17px; font-weight: 600; margin: 0 0 3px; letter-spacing: 0.2px; }
    .version { font-size: 12px; color: #9aa0a6; margin: 0 0 2px; }
    /* The product line. Filled from package.json's description at runtime (see
       about.js), so this file holds no copy of the wording to drift out of sync.
       Empty until that resolves, hence no styling that would show a blank box. */
    .tagline { font-size: 12px; color: #9aa0a6; margin: 12px 0 0; line-height: 1.45; }
    /* Runtime versions: support detail, so present but visually subordinate. */
    .runtime {
      margin-top: 16px; padding-top: 14px;
      border-top: 1px solid #3c4043;
      font-size: 11px; color: #5f6368; line-height: 1.6;
      font-variant-numeric: tabular-nums;
    }
    .links { margin-top: 14px; font-size: 12px; }
    a {
      color: #8ab4f8; text-decoration: none;
      -webkit-app-region: no-drag;   /* a draggable link cannot be clicked */
    }
    a:hover { text-decoration: underline; }
    .copyright { margin-top: 14px; font-size: 11px; color: #5f6368; }
    /* Shown instead of the version when the lookup fails, so the box degrades
       to "we don't know" rather than to a blank space. */
    .unknown { color: #5f6368; font-style: italic; }
  </style>
</head>
<body>
  <img class="logo" src="../icon.png" alt="" />
  <h1>Vibeconferencing</h1>
  <p class="version" id="version">…</p>
  <p class="tagline" id="tagline"></p>

  <div class="runtime" id="runtime"></div>

  <div class="links">
    <a href="https://vibeconferencing.com" target="_blank" rel="noopener">vibeconferencing.com</a>
  </div>
  <div class="copyright">© 2026 Stan James</div>

  <script src="about.js"></script>
</body>
</html>
