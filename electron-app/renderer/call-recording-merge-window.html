<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Preparing recording…</title>
  <style>
    /* Same dark palette/shape as call-recording-window.html. This is the
       next window a user watching that one sees, so it should feel like a
       continuation, not a different app. */
    body {
      margin: 0;
      padding: 14px 16px;
      background: #202124;
      color: #e8eaed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-app-region: drag;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      min-width: 0;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #5f6368;
      border-top-color: #8ab4f8;
      flex: none;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      -webkit-app-region: no-drag;
      background: #3c4043;
      color: #e8eaed;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      flex: none;
    }
    button:hover { background: #4a4d51; }
    button:disabled { opacity: 0.5; cursor: default; }
    .note {
      margin-top: 6px;
      font-size: 11px;
      color: #9aa0a6;
    }
  </style>
</head>
<body>
  <div class="row">
    <div class="status">
      <div class="spinner" id="spinner"></div>
      <div class="label" id="label">Preparing recording…</div>
    </div>
    <button id="cancelBtn" type="button">Cancel</button>
  </div>
  <div class="note" id="note">Mixing audio and video into the final file. This can take a minute.</div>
  <script src="call-recording-merge-window.js"></script>
</body>
</html>
