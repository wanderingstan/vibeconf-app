<!DOCTYPE html>
<!-- supervisor.html — the over-bot view (#301).

     Everything on this page is about the FLEET, never about one bot: which bots
     exist, which are up, what is coming for any of them. A bot's own controls
     stay in its own window — this one launches them. -->
<html>
<head>
  <meta charset="utf-8" />
  <title>Vibeconferencing</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="ui-icons.css" />
  <style>
    /* The bot panel's system (panel.css :root, the same tokens as
       vibeconferencing.com): cream grounds, ink type, magenta accents, call
       green. Keep these values in step with panel.css; the semantic names on
       the right are what this page's rules use. */
    :root {
      --cream: #FFF4DA; --paper: #FFFDF7; --paper-lo: #FFE7B3;
      --ink: #4A3140; --ink-soft: #6B5566; --ink-faint: #9A8798;
      --magenta: #9F0BA4; --pink: #E62776; --go: #44CE81; --go-deep: #3BBE74;
      --shadow-lo: -1px 1px 3px rgba(74, 49, 64, 0.14);
      --font-display: 'Syne', Futura, 'Trebuchet MS', sans-serif;
      --font-body: 'DM Sans', 'Avenir Next', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --bg: var(--cream); --surface: #FFEDC4; --hover: var(--paper-lo); --line: #F1D9A4;
      --text: var(--ink); --dim: var(--ink-soft); --faint: var(--ink-faint);
      --accent: var(--magenta); --accent-hover: var(--pink);
      --up: var(--go-deep); --call: var(--go); --warn: var(--pink);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* #301 one-window spike: this page is the sidebar plus an empty stage.
       The selected bot's panel is a separate view the supervisor lays over the
       stage (SIDEBAR_W / PANEL_W in supervisor-app.js; keep the width equal). */
    html, body { height: 100%; }
    body { display: flex; overflow: hidden; }
    .sidebar {
      width: 320px; flex: none; height: 100%; overflow-y: auto;
      border-right: 1px solid var(--line);
    }
    /* Pinned top of the sidebar: the toggle, then the three lists. */
    .topbar {
      position: sticky; top: 0; z-index: 2; background: var(--bg);
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px 10px 11px; /* toggle at the same x as on the collapsed rail */
    }
    .icon-btn, .mode {
      width: 34px; height: 34px; padding: 0; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center;
      background: none; color: var(--dim); flex: none;
    }
    .icon-btn:hover:not(:disabled), .mode:hover:not(:disabled) { background: var(--surface); color: var(--text); }
    .icon-btn svg, .mode svg {
      width: 20px; height: 20px; fill: none; stroke: currentColor;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    }
    .icon-btn svg .dotfill, .mode svg .dotfill { fill: currentColor; }
    .modes { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface); }
    .modes .mode { width: 38px; height: 30px; border-radius: 9px; }
    .modes .mode.active, .modes .mode.active:hover { background: var(--hover); color: var(--text); }
    .pane { padding: 4px 12px 16px; }
    .empty.stub { padding: 8px; line-height: 1.5; }
    .pane footer { padding: 14px 8px 0; flex-direction: column; gap: 4px; }
    /* Collapsed: a rail with only the toggle. Its width is RAIL_W in
       supervisor-app.js, which lays the panel out beside it. */
    /* The sidebar is a column: top bar, the scrolling list, the account line. */
    .sidebar { display: flex; flex-direction: column; overflow: hidden; }
    .sidebar .pane { flex: 1; overflow-y: auto; min-height: 0; }
    .account {
      flex: none; border-top: 1px solid var(--line); padding: 10px 20px 12px;
      font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; min-height: 40px;
    }
    .account .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .account button.who {
      display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left;
      border: none; background: none; padding: 4px 6px; margin-left: -6px; border-radius: 6px;
      font: inherit; color: inherit; cursor: pointer;
    }
    .account button.who:hover { background: var(--paper-lo, #FFE7B3); color: var(--ink, #4A3140); }
    .account .me-avatar { width: 22px; height: 22px; border-radius: 50%; flex: none; object-fit: cover; }
    .account .me-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account.signed-out .who { color: var(--warn); }
    .account button { font-size: 12px; padding: 3px 10px; }
    .account button.gear, .rail-foot button.gear {
      flex: none; width: 30px; height: 30px; padding: 0; border: none; background: none;
      border-radius: 50%; color: var(--dim); font-size: 18px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .account button.gear:hover, .rail-foot button.gear:hover { background: var(--paper-lo, #FFE7B3); color: var(--ink, #4A3140); }
    .rail { width: 56px; flex: none; height: 100%; border-right: 1px solid var(--line); padding: 10px 11px; display: flex; flex-direction: column; align-items: center; }
    .rail[hidden] { display: none; }
    .rail-foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 2px; }
    .rail-foot button.me {
      width: 30px; height: 30px; padding: 0; border: none; background: none; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .rail-foot button.me img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
    .rail-foot button.me:hover { box-shadow: 0 0 0 2px var(--paper-lo, #FFE7B3); }
    /* No picture: your initial in a filled circle. Signed out: a hollow ring. */
    .rail-foot .me-initial {
      width: 26px; height: 26px; border-radius: 50%; background: var(--ink, #4A3140); color: var(--cream, #FFF4DA);
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    }
    .rail-foot .me-ring { width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--dim); box-sizing: border-box; }
    .rail[hidden], .sidebar[hidden], .pane[hidden] { display: none; }
    .stage {
      flex: 1; height: 100%; display: flex; align-items: center; justify-content: center;
      color: var(--faint); font-size: 13px; text-align: center; padding: 24px;
    }
    .bot.selectable { cursor: pointer; }

    /* ── Row actions: merge into a call, and the … menu ──
       Hidden until the row is hovered or selected, like Claude's own sidebar;
       merge stays visible whenever there is a call it can join, since that is
       exactly when you reach for it. */
    .row-actions { margin-left: auto; display: flex; gap: 2px; flex: none; }
    .row-act {
      width: 30px; height: 30px; padding: 0; border: none; border-radius: 8px; background: none;
      color: var(--dim); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      visibility: hidden;
    }
    .row-act svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .row-act.more svg { fill: currentColor; stroke: none; }
    .row-act:hover { background: var(--paper); color: var(--text); }
    .bot:hover .row-act, .bot.selected .row-act, .bot.can-merge .row-act.merge { visibility: visible; }
    .row-act.merge { color: var(--go-deep); }
    .row-menu {
      position: fixed; z-index: 50; min-width: 170px; padding: 4px;
      background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
      box-shadow: -1px 2px 8px rgba(74, 49, 64, 0.22); display: flex; flex-direction: column;
    }
    .row-menu-item {
      text-align: left; padding: 7px 10px; border: none; border-radius: 5px; background: none;
      font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
    }
    .row-menu-item:hover:not(:disabled) { background: var(--paper-lo); }
    .row-menu-item:disabled { color: var(--faint); cursor: default; }
    .row-menu-item.danger { color: var(--warn); }

    /* ── Sessions: the user's Claude Code sessions, below the bots ── */
    .section-head {
      margin: 18px 8px 6px; font-family: var(--font-mono, 'JetBrains Mono', monospace); font-size: 11px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase; color: var(--magenta);
    }
    .section-head::before { content: '\2726  '; color: var(--pink); }
    .session { display: flex; align-items: center; gap: 12px; padding: 4px 8px; border-radius: 10px; cursor: pointer; }
    .session:hover { background: var(--surface); }
    .session.selected { background: var(--paper-lo); }
    .session-icon {
      flex: none; width: 44px; height: 44px; border-radius: 11px; border: 1.5px solid var(--ink-faint);
      display: flex; align-items: center; justify-content: center; color: var(--ink-soft);
    }
    .session-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .session .who { min-width: 0; flex: 1; }
    .session .title { font-weight: 600; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session .sub { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--go-deep); margin-right: 6px; vertical-align: 1px; }

    /* A session on the stage: what it is, its last lines, and the bot it could become. */
    .stage.has-session { display: block; text-align: left; overflow-y: auto; color: var(--ink); font-size: 13px; padding: 20px 16px; font-family: var(--font-body, 'DM Sans', sans-serif); }
    .sess-title { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
    .sess-meta { margin-top: 4px; font-family: var(--font-mono, monospace); font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); overflow-wrap: anywhere; }
    .sess-excerpt { margin: 14px 0 16px; max-height: 210px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
    .sess-line { font-size: 12px; line-height: 1.45; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
    .sess-line.user { margin-left: 14px; padding: 6px 9px; border-radius: 6px; background: var(--paper-lo); color: var(--ink); }
    .sess-create {
      width: 100%; height: 44px; border-radius: 22px; border: 1.5px solid var(--ink); background: var(--go); color: var(--ink);
      font-family: var(--font-display); font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: -1px 2px 6px rgba(74,49,64,.2);
    }
    .sess-create:hover:not(:disabled) { background: var(--go-deep); }
    .sess-create:disabled { opacity: .6; cursor: default; }
    .sess-opts { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .sess-opt { display: flex; flex-direction: column; gap: 4px; }
    .sess-opt label { font-size: 12px; font-weight: 600; color: var(--ink); }
    .sess-opt input, .sess-opt select {
      height: 34px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--paper); color: var(--ink);
      padding: 0 10px; font: inherit; font-size: 13px;
    }
    .sess-shuffle { align-self: flex-start; border: none; background: none; color: var(--magenta); font: inherit; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; }
    .sess-hint { font-size: 11.5px; color: var(--ink-soft); }
    .sess-hint:empty { display: none; }
    .sess-note { margin-top: 12px; font-size: 11.5px; line-height: 1.45; color: var(--ink-soft); }
    .sess-err { margin-top: 10px; color: var(--warn); font-size: 12px; }
    /* The stage while a bot wakes up: its face and name from disk, then the
       live panel covers it. */
    .waking { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .waking-face {
      width: 160px; height: 160px; border-radius: 40px; overflow: hidden;
      background: var(--hover); color: var(--dim); font-size: 64px; font-weight: 500;
      display: flex; align-items: center; justify-content: center;
    }
    .waking-face img { width: 100%; height: 100%; object-fit: cover; }
    .waking-name { color: var(--text); font-size: 20px; font-weight: 500; }
    .waking-note { color: var(--dim); animation: waking 1.6s ease-in-out infinite; max-width: 360px; line-height: 1.5; }
    .waking-note.still { animation: none; }
    @keyframes waking { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .waking-note { animation: none; } }
    .bot.selected { background: var(--hover); }
    .bot.selected .dot { border-color: var(--hover); }
    body {
      background: var(--bg); color: var(--text);
      font: 13px/1.45 'Google Sans', Roboto, Arial, sans-serif;
      user-select: none; cursor: default;
    }
    header {
      padding: 18px 20px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    h1 { font-size: 18px; font-weight: 500; color: var(--accent); }
    .count { color: var(--dim); font-size: 12px; margin-top: 2px; }
    h2 {
      font-size: 13px; font-weight: 500; color: var(--dim);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin: 0 0 8px; padding: 0 8px;
    }
    .section { padding: 8px 12px 16px; }
    .section + .section { border-top: 1px solid var(--line); padding-top: 16px; }
    .empty { color: var(--dim); padding: 6px 8px; }

    /* ── Bot rows ── unboxed, like the panel's masthead: the face carries the
       row, and hover is the only chrome. */
    .bot {
      display: flex; align-items: center; gap: 12px;
      padding: 4px 8px; border-radius: 10px;
    }
    .bot:hover { background: var(--surface); }
    /* Rounded SQUARE, same shape as the panel's avatar and the profile
       switcher's thumbnail: it shows more of the background, which is the most
       customizable part of a bot's face. */
    .avatar {
      position: relative; flex: none;
      width: 44px; height: 44px; border-radius: 11px;
      background: var(--hover); color: var(--dim);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 500;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
    /* Status dot on the avatar's corner, ringed in the background colour so it
       stays legible over any artwork. The words in .sub say the same thing:
       colour alone would hide the one state that matters most, in a call. */
    .dot {
      position: absolute; right: -3px; bottom: -3px;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--faint); border: 2.5px solid var(--bg);
    }
    .bot:hover .dot { border-color: var(--surface); }
    .dot.up { background: var(--up); }
    .dot.call { background: var(--call); }
    .dot.stuck { background: var(--warn); }
    .who { flex: 1; min-width: 0; }
    .name {
      font-size: 14px; font-weight: 500; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tag {
      font-size: 11px; font-weight: 500; color: var(--dim);
      background: var(--surface); border-radius: 6px; padding: 1px 6px; margin-left: 6px;
      vertical-align: 1px;
    }
    .bot:hover .tag { background: var(--hover); }
    .sub {
      color: var(--dim); font-size: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sub .state.up { color: var(--up); }
    .sub .state.call { color: var(--call); }
    .sub .state.stuck { color: var(--warn); }

    /* Pill buttons, as in the panel. */
    button {
      font: 500 13px 'Google Sans', Roboto, Arial, sans-serif;
      border: none; border-radius: 20px; padding: 6px 16px; cursor: pointer;
      background: var(--surface); color: var(--text); flex: none;
    }
    button:hover:not(:disabled) { background: var(--hover); }
    .bot:hover button:not(.primary) { background: var(--hover); }
    .bot:hover button:not(.primary):hover:not(:disabled) { background: var(--paper); }
    button.primary { background: var(--accent); color: var(--bg); }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: default; }
    /* Most people have a bot or three, and a plain blue Call is right for
       them. A big fleet (a developer's, mostly) turns every closed bot's Call
       into a wall of accent, so past a handful those go quiet until their row
       is hovered. Running bots stay blue. supervisor.js sets .many. */
    #bots.many .bot button.primary.closed { background: var(--surface); color: var(--text); }
    #bots.many .bot:hover button.primary.closed { background: var(--accent); color: var(--bg); }
    #bots.many .bot:hover button.primary.closed:hover:not(:disabled) { background: var(--accent-hover); }
    button.ghost { background: none; color: var(--dim); padding: 6px 12px; }
    button.ghost:hover:not(:disabled) { background: var(--surface); color: var(--text); }

    .actions { display: flex; gap: 6px; flex: none; }
    .err { color: var(--warn); font-size: 12px; white-space: normal; }

    /* ── Detected call ── the Meet open in the user's browser, which is what
       "Add" puts a bot into. Shown only while there is one. */
    #callBar:empty { display: none; }
    .callbar {
      margin: 0 20px 4px; padding: 10px 14px; border-radius: 12px;
      background: var(--surface); display: flex; align-items: center; gap: 10px;
    }
    .callbar .live { width: 8px; height: 8px; border-radius: 50%; background: var(--up); flex: none; }
    .callbar .label { color: var(--dim); font-size: 12px; }
    .callbar .code { font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
    .callbar select {
      font: 500 13px 'Google Sans', Roboto, Arial, sans-serif; color: var(--text);
      background: var(--hover); border: none; border-radius: 8px; padding: 3px 6px; outline: none;
    }

    /* ── Upcoming ── */
    .event { padding: 8px; border-radius: 12px; display: flex; gap: 12px; align-items: baseline; }
    .event:hover { background: var(--surface); }
    .event .when {
      flex: none; min-width: 64px; color: var(--accent); font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .event .what { min-width: 0; }
    .event .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event .for { color: var(--dim); font-size: 12px; }
    .banner {
      margin: 0 8px 10px; padding: 8px 12px; border-radius: 8px; font-size: 12px;
      background: #FCE3EE; color: var(--pink);
    }
    footer {
      padding: 12px 20px 16px; color: var(--faint); font-size: 11px;
      display: flex; justify-content: space-between; gap: 12px;
    }

    /* ── Type, as in the bot panel: Syne for names, DM Sans for body, JetBrains
       Mono for the small print (status lines, the account, notes). ── */
    body { font-family: var(--font-body); }
    .bot .name { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.1px; }
    .sub, .tag, .account, .empty, .pane footer, .waking-note, .stage, .err, .event .for {
      font-family: var(--font-mono); font-size: 11.5px;
    }
    .waking-name { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
    .tag { background: var(--paper-lo); color: var(--ink-soft); }
    .bot:hover .tag { background: var(--paper); }
    .bot.selected { background: var(--paper-lo); }
    .bot.selected .dot { border-color: var(--paper-lo); }

    /* The three-way switch: a sunken cream track, the active choice raised on paper. */
    .modes { background: var(--paper-lo); }
    .modes .mode.active, .modes .mode.active:hover { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-lo); }

    /* "New bot": a dashed tile where a face would be. */
    .new-tile { background: transparent; border: 1.5px dashed var(--ink-faint); color: var(--ink-soft); }
    .new-tile span { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; }
    .new-bot .name { color: var(--ink-soft); }
    .new-bot:hover .new-tile { border-color: var(--ink); color: var(--ink); }
    .new-bot:hover .name { color: var(--ink); }
  </style>
</head>
<body>
  <!-- #301 one window: the sidebar, like the Claude app's. A pinned top bar
       (hide/show, and which list the sidebar shows) over one pane per list.
       Collapsed, it shrinks to a rail holding only the toggle. -->
  <aside class="sidebar" id="sidebar">
    <div class="topbar">
      <button class="icon-btn" id="collapse" title="Hide sidebar" aria-label="Hide sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><line x1="9.5" y1="4.5" x2="9.5" y2="19.5"/></svg></button>
      <div class="modes" role="tablist" aria-label="Sidebar shows">
        <button class="mode" role="tab" data-mode="bots" title="Bots" aria-label="Bots">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="9.2" cy="10.2" r=".6" class="dotfill"/><circle cx="14.8" cy="10.2" r=".6" class="dotfill"/><path d="M8.6 14.2c.9 1.3 2 1.9 3.4 1.9s2.5-.6 3.4-1.9"/></svg>
        </button>
        <button class="mode" role="tab" data-mode="upcoming" title="Upcoming meetings" aria-label="Upcoming meetings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8.5" y1="3.5" x2="8.5" y2="7"/><line x1="15.5" y1="3.5" x2="15.5" y2="7"/></svg>
        </button>
        <button class="mode" role="tab" data-mode="history" title="Past calls" aria-label="Past calls">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
      </div>
    </div>

    <div class="pane" data-pane="bots">
      <div id="orphans"></div>
      <div id="bots"><div class="empty">Looking…</div></div>
      <!-- Your recent Claude Code sessions, any of which can become a bot
           (supervisor.js renderSessions). -->
      <div id="sessions"></div>
    </div>

    <div class="pane" data-pane="upcoming" hidden>
      <div id="calendarBanner"></div>
      <div id="events"><div class="empty">No meetings for your bots in the next 24 hours.</div></div>
      <footer>
        <span>Watching the calendar for every bot, including closed ones</span>
        <span id="tickStatus"></span>
      </footer>
    </div>

    <div class="pane" data-pane="history" hidden>
      <div class="empty stub">A record of your bots' past calls will appear here.</div>
    </div>
    <!-- Pinned to the bottom: who is signed in to vibeconferencing.com. One
         login for the whole app, so it lives here rather than in each bot. -->
    <div class="account" id="account"></div>
  </aside>

  <div class="rail" id="rail" hidden>
    <button class="icon-btn" id="expand" title="Show sidebar" aria-label="Show sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><line x1="9.5" y1="4.5" x2="9.5" y2="19.5"/></svg></button>
    <!-- The account and App Settings, still within reach with the sidebar
         collapsed: your picture stacked on the gear (renderAccount). -->
    <div class="rail-foot" id="railAccount"></div>
  </div>

  <main class="stage" id="stage">Select a bot to see it here.</main>

  <script src="supervisor.js"></script>
</body>
</html>
