<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="The library ends where agents begin" font-size="13"><style>
  svg { --edge: #8c959f; --grid: #d0d7de; --accent: #0969da; --ink: #1f2328; --quiet: #59636e; --tint: #f6f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --edge: #6e7681; --grid: #3d444d; --accent: #4493f8; --ink: #e6edf3; --quiet: #9198a1; --tint: #161b22; }
  }
</style><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" style="fill:var(--ink)">The library ends where agents begin</text><g fill="none" stroke-width="1.25" style="stroke:var(--edge)"><path d="M380 128V168" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"></path><path d="M196 256V296" marker-end="url(#arch-arrow)"></path><path d="M464 256V296" marker-end="url(#arch-arrow)"></path><path d="M196 352V392" marker-end="url(#arch-arrow)"></path><path d="M564 352V392" marker-end="url(#arch-arrow)"></path><path d="M548 212H524"></path></g><text x="392" y="152" font-size="11.5" style="fill:var(--quiet)">calls down (join, speak, chat, share), events up</text><text x="208" y="280" font-size="11.5" style="fill:var(--quiet)">Host interface</text><text x="208" y="376" font-size="11.5" style="fill:var(--quiet)">page script injected before load, message bridge</text><g><rect x="24" y="56" width="712" height="72" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--edge)"></rect><text x="40" y="80" font-weight="600" style="fill:var(--ink)">vibeconf-app (stays)</text><text x="40" y="96" font-size="11.5" style="fill:var(--quiet)">main.js, local-server.js HTTP API, MCP server, agent spawn and turn-taking</text><text x="40" y="112" font-size="11.5" style="fill:var(--quiet)">Avatar and whiteboard pages, preferences, sync to vibeconferencing.com</text></g><g><rect x="24" y="168" width="500" height="88" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--accent);stroke:var(--accent)"></rect><text x="40" y="192" font-weight="600" style="fill:var(--ink)">@vibeconferencing/calls core</text><text x="40" y="208" font-size="11.5" style="fill:var(--ink)">join(url) picks the provider; Call object with typed events</text><text x="40" y="224" font-size="11.5" style="fill:var(--ink)">Capability gating, JoinError codes, CaptionRouter</text><text x="40" y="240" font-size="11.5" style="fill:var(--ink)">Recording (optional)</text></g><g><rect x="548" y="168" width="188" height="88" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="4 4" style="stroke:var(--edge)"></rect><text x="564" y="192" font-weight="600" style="fill:var(--ink)">Adapters (optional)</text><text x="564" y="208" font-size="11.5" style="fill:var(--quiet)">TTS: ElevenLabs, system</text><text x="564" y="224" font-size="11.5" style="fill:var(--quiet)">STT: ElevenLabs Scribe</text><text x="564" y="240" font-size="11.5" style="fill:var(--quiet)">or bring your own</text></g><g><rect x="24" y="296" width="344" height="56" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--edge)"></rect><text x="40" y="320" font-weight="600" style="fill:var(--ink)">hosts/electron (ships first)</text><text x="40" y="336" font-size="11.5" style="fill:var(--quiet)">Partitions, preloads, IPC, display-media handler</text></g><g><rect x="392" y="296" width="344" height="56" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--edge)"></rect><text x="408" y="320" font-weight="600" style="fill:var(--ink)">hosts/playwright</text><text x="408" y="336" font-size="11.5" style="fill:var(--quiet)">Persistent contexts, addInitScript, exposeBinding</text></g><g><rect x="24" y="392" width="712" height="104" rx="8" stroke-width="1.25" style="fill:var(--tint);stroke:var(--edge)"></rect><text x="40" y="414" font-weight="600" style="fill:var(--ink)">Platform web client tab: Meet, Zoom, Teams, Slack, WhatsApp, Telegram, Twilio</text><rect x="40" y="424" width="332" height="56" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--edge)"></rect><text x="56" y="448" font-weight="600" style="fill:var(--ink)">Provider page script</text><text x="56" y="464" font-size="11.5" style="fill:var(--quiet)">DOM automation and selectors, one per platform</text><rect x="388" y="424" width="332" height="56" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--edge)"></rect><text x="404" y="448" font-weight="600" style="fill:var(--ink)">Media inject</text><text x="404" y="464" font-size="11.5" style="fill:var(--quiet)">Virtual mic and camera, getUserMedia, WebRTC tap</text></g></svg>
