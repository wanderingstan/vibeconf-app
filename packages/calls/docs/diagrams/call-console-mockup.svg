<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468" role="img" aria-label="call-console shows what the bot hears beside what it can do" font-size="13"><style>
  svg { --edge: #8c959f; --grid: #d0d7de; --accent: #0969da; --ink: #1f2328; --quiet: #59636e; --tint: #f6f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --edge: #6e7681; --grid: #3d444d; --accent: #4493f8; --ink: #e6edf3; --quiet: #9198a1; --tint: #161b22; }
  }
</style><text x="24" y="34" font-size="15" font-weight="600" style="fill:var(--ink)">call-console shows what the bot hears beside what it can do</text><g><rect x="24" y="52" width="348" height="288" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--edge)"></rect><text x="40" y="76" font-weight="600" style="fill:var(--ink)">Coming in from the call</text><text x="40" y="100" font-size="11.5" style="fill:var(--quiet)">State: in-call on Google Meet (example)</text><rect x="40" y="112" width="316" height="88" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--accent);stroke:var(--accent)"></rect><text x="56" y="136" font-weight="600" style="fill:var(--ink)">Captions, live</text><text x="56" y="152" font-size="11.5" style="fill:var(--ink)">Ann: can you share the board?</text><text x="56" y="168" font-size="11.5" style="fill:var(--ink)">Bob: and post the link in chat</text><text x="56" y="184" font-size="11.5" style="fill:var(--quiet)">Ann: (speaking, not final yet)</text><text x="40" y="224" font-weight="600" style="fill:var(--ink)">Participants</text><text x="40" y="240" font-size="11.5" style="fill:var(--quiet)">Ann (speaking), Bob, Alice (AI)</text><text x="40" y="264" font-weight="600" style="fill:var(--ink)">Chat</text><text x="40" y="280" font-size="11.5" style="fill:var(--quiet)">Bob: here is the doc</text><text x="40" y="304" font-weight="600" style="fill:var(--ink)">Screen share</text><text x="40" y="320" font-size="11.5" style="fill:var(--quiet)">Nobody presenting</text></g><g><rect x="388" y="52" width="348" height="288" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--edge)"></rect><text x="404" y="76" font-weight="600" style="fill:var(--ink)">Sent to the call</text><rect x="404" y="92" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="570" y="92" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="404" y="136" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="570" y="136" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="404" y="180" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="570" y="180" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="404" y="224" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="570" y="224" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="404" y="268" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="570" y="268" width="150" height="32" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="4 4" style="stroke:var(--grid)"></rect><text x="479" y="112" text-anchor="middle" style="fill:var(--ink)">Join</text><text x="645" y="112" text-anchor="middle" style="fill:var(--ink)">Leave</text><text x="479" y="156" text-anchor="middle" style="fill:var(--ink)">Mute mic</text><text x="645" y="156" text-anchor="middle" style="fill:var(--ink)">Camera on</text><text x="479" y="200" text-anchor="middle" style="fill:var(--ink)">Play clip</text><text x="645" y="200" text-anchor="middle" style="fill:var(--ink)">Send chat</text><text x="479" y="244" text-anchor="middle" style="fill:var(--ink)">Share a page</text><text x="645" y="244" text-anchor="middle" style="fill:var(--ink)">Stop share</text><text x="479" y="288" text-anchor="middle" style="fill:var(--ink)">Screenshot</text><text x="645" y="288" text-anchor="middle" style="fill:var(--quiet)">Raw audio</text><text x="404" y="324" font-size="11.5" style="fill:var(--quiet)">Dashed: this platform lacks the capability</text></g><g><rect x="24" y="356" width="712" height="88" rx="8" stroke-width="1.25" style="fill:var(--tint);stroke:var(--edge)"></rect><text x="40" y="380" font-weight="600" style="fill:var(--ink)">Event log, both directions, raw</text><text x="40" y="396" font-size="11.5" style="fill:var(--quiet)">in    caption       speaker 'Ann', text 'can you share the board?', final true</text><text x="40" y="412" font-size="11.5" style="fill:var(--quiet)">out   share.start   source page, audio true</text><text x="40" y="428" font-size="11.5" style="fill:var(--quiet)">in    share         presenter 'Alice (AI)', active true</text></g></svg>
