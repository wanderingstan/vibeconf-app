</style><defs><marker id="cls-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" style="fill:var(--ink)">The app talks to one Call API; providers sit behind one wire contract</text><text x="24" y="54" font-size="11.5" style="fill:var(--quiet)">Accent: built in Phase 0 (PR #928). Dashed: planned. Plain: exists today.</text><g fill="none" stroke-width="1.25" style="stroke:var(--edge)"><path d="M248 132H276" marker-end="url(#cls-arrow)"></path><path d="M484 132H512" marker-end="url(#cls-arrow)"></path><path d="M616 160V216" marker-start="url(#cls-arrow)" marker-end="url(#cls-arrow)"></path><path d="M206 412V444" marker-start="url(#cls-arrow)" marker-end="url(#cls-arrow)"></path><path d="M554 444V412" marker-end="url(#cls-arrow)"></path><path d="M380 500V516" marker-start="url(#cls-arrow)" marker-end="url(#cls-arrow)"></path></g><g stroke-width="1" style="stroke:var(--edge)"><line x1="84" y1="608" x2="84" y2="624"></line><line x1="182" y1="608" x2="182" y2="624"></line><line x1="280" y1="608" x2="280" y2="624"></line><line x1="378" y1="608" x2="378" y2="624"></line><line x1="476" y1="608" x2="476" y2="624"></line><line x1="574" y1="608" x2="574" y2="624"></line><line x1="672" y1="608" x2="672" y2="624"></line></g><text x="604" y="196" text-anchor="end" font-size="11.5" style="fill:var(--quiet)">Call API: join(url), speak, chat, share, on(event)</text><g><rect x="24" y="72" width="712" height="104" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><text x="40" y="96" font-weight="600" style="fill:var(--ink)">vibeconf-app (stays in the app)</text><rect x="40" y="104" width="208" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><text x="56" y="128" font-weight="600" style="fill:var(--ink)">MCP server, agents</text><text x="56" y="144" font-size="11.5" style="fill:var(--quiet)">mcp-server/server.js</text><rect x="276" y="104" width="208" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><text x="292" y="128" font-weight="600" style="fill:var(--ink)">local-server.js</text><text x="292" y="144" font-size="11.5" style="fill:var(--quiet)">HTTP API, about 55 on* hooks</text><rect x="512" y="104" width="208" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><text x="528" y="128" font-weight="600" style="fill:var(--ink)">main.js</text><text x="528" y="144" font-size="11.5" style="fill:var(--quiet)">orchestration, views, prefs</text></g><g><rect x="24" y="216" width="712" height="212" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><text x="40" y="240" font-weight="600" style="fill:var(--ink)">@vibeconferencing/calls, Node side</text></g><g><rect x="40" y="252" width="332" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="4 4" style="stroke:var(--edge)"></rect><text x="56" y="276" font-weight="600" style="fill:var(--ink)">PLATFORMS table and joinUrl(url)</text><text x="56" y="292" font-size="11.5" style="fill:var(--quiet)">platformFromUrl picks it; one join path for all</text><text x="56" y="308" font-size="11.5" style="fill:var(--quiet)">Phase 1: replaces 4 mode flags, 8 join functions</text></g><g><rect x="388" y="252" width="332" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="4 4" style="stroke:var(--edge)"></rect><text x="404" y="276" font-weight="600" style="fill:var(--ink)">Host interface</text><text x="404" y="292" font-size="11.5" style="fill:var(--quiet)">ElectronHost: today's views, preloads, IPC</text><text x="404" y="308" font-size="11.5" style="fill:var(--quiet)">PlaywrightHost: Phase 4, for servers and CI</text></g><g><rect x="40" y="340" width="332" height="72" rx="8" fill-opacity="0.12" stroke-width="2" stroke-dasharray="none" style="fill:var(--accent);stroke:var(--accent)"></rect><text x="56" y="364" font-weight="600" style="fill:var(--ink)">CallClient implements CallProvider</text><text x="56" y="380" font-size="11.5" style="fill:var(--ink)">Node proxy: commands down, events up over IPC</text><text x="56" y="396" font-size="11.5" style="fill:var(--ink)">call-client.js, PR #928</text></g><g><rect x="388" y="340" width="332" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><text x="404" y="364" font-weight="600" style="fill:var(--ink)">CaptionRouter (caption-source.js)</text><text x="404" y="380" font-size="11.5" style="fill:var(--quiet)">PlatformCaptions: scraped platform captions</text><text x="404" y="396" font-size="11.5" style="fill:var(--quiet)">AudioTranscription: audio tap plus STT</text></g><g><rect x="24" y="444" width="712" height="56" rx="8" stroke-width="1.25" style="fill:var(--tint);stroke:var(--edge)"></rect><text x="40" y="468" font-weight="600" style="fill:var(--ink)">Wire contract: call-provider.js</text><text x="40" y="484" font-size="11.5" style="fill:var(--quiet)">CALL_COMMANDS go down, CALL_EVENTS come up, CALL_BOOTSTRAP at startup</text></g><g><rect x="24" y="516" width="712" height="236" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><text x="40" y="540" font-weight="600" style="fill:var(--ink)">In each call page</text></g><g><rect x="40" y="552" width="680" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><text x="56" y="576" font-weight="600" style="fill:var(--ink)">CallProvider, abstract base class</text><text x="56" y="592" font-size="11.5" style="fill:var(--quiet)">join, leave, mic, camera, speak, chat, share, captions, participants, events</text></g><g><rect x="40" y="624" width="88" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="138" y="624" width="88" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="236" y="624" width="88" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="334" y="624" width="88" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><rect x="432" y="624" width="88" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="4 4" style="stroke:var(--edge)"></rect><rect x="530" y="624" width="88" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="4 4" style="stroke:var(--edge)"></rect><rect x="628" y="624" width="88" height="40" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="4 4" style="stroke:var(--edge)"></rect><text x="84" y="648" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">Meet</text><text x="182" y="648" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">Zoom</text><text x="280" y="648" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">Teams</text><text x="378" y="648" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">Slack</text><text x="476" y="648" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">WhatsApp</text><text x="574" y="648" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">Telegram</text><text x="672" y="648" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">Twilio</text></g><g><rect x="40" y="680" width="680" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="none" style="stroke:var(--edge)"></rect><text x="56" y="704" font-weight="600" style="fill:var(--ink)">page-inject media core (Phase 2 splits out the app's avatar and whiteboard)</text><text x="56" y="720" font-size="11.5" style="fill:var(--quiet)">VirtualMic, VirtualCamera, getUserMedia and getDisplayMedia overrides, WebRTC audio tap</text></g></svg>
